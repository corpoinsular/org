<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#004B63">
<meta name="description" content="Corporación Insular Digital (COINDI). Impulsamos la inclusión digital, la creación audiovisual y las iniciativas comunitarias desde el territorio insular.">
<title>Corporación Insular Digital | COINDI</title>
<style>
:root{--petroleo:#004B63;--caribe:#00A6D6;--arena:#FFC247;--blanco:#FFFFFF;--texto:#173640;--gris:#5C737B;--fondo:#F3F8FA;--borde:#DCE8EC;--radio:22px;--sombra:0 16px 45px rgba(0,54,72,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{font-family:Arial,Helvetica,sans-serif;color:var(--texto);background:#fff;line-height:1.65}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--arena);outline-offset:4px}
.contenedor{width:min(1180px,calc(100% - 40px));margin-inline:auto}
.franja-superior{height:5px;background:linear-gradient(90deg,var(--petroleo) 0 55%,var(--caribe) 55% 85%,var(--arena) 85%)}

/* NAVEGACIÓN */
.encabezado{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);border-bottom:1px solid var(--borde);backdrop-filter:blur(14px)}
.navegacion{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.marca{flex-shrink:0}
.marca img{width:215px;max-height:70px;object-fit:contain;object-position:left center}
.menu{display:flex;align-items:center;gap:22px}
.menu a:not(.boton){color:var(--petroleo);font-size:.9rem;font-weight:700}
.menu a:not(.boton):hover{color:#008CB5}
.menu a[aria-current="page"]{color:#008CB5;text-decoration:underline;text-decoration-color:var(--arena);text-decoration-thickness:3px;text-underline-offset:9px}
.boton-menu{display:none;border:1px solid var(--borde);border-radius:12px;padding:9px 13px;background:white;color:var(--petroleo);cursor:pointer;font-size:1.35rem}

/* BOTONES */
.boton{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 21px;border:1px solid transparent;border-radius:50px;font-weight:700;text-align:center;transition:.2s ease}
.boton:hover{transform:translateY(-2px)}
.boton-principal{background:var(--arena);color:#173640}
.boton-principal:hover{background:#FFD16C}
.boton-caribe{background:var(--caribe);color:#003343}
.boton-caribe:hover{background:#35BDE4}
.boton-borde-claro{color:white;border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.06)}
.boton-borde-claro:hover{background:rgba(255,255,255,.14)}
.boton-borde-oscuro{color:var(--petroleo);border-color:var(--petroleo);background:transparent}
.boton-borde-oscuro:hover{background:#E8F7FB}

/* PORTADA */
.portada{position:relative;isolation:isolate;overflow:hidden;background:var(--petroleo);color:white}
.portada::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(0,38,51,.96),rgba(0,57,75,.75),rgba(0,35,49,.25)),url("assets/bocachica-portada.jpg") center 52%/cover no-repeat}
.portada::after{content:"";position:absolute;z-index:-1;inset:auto 0 0;height:6px;background:linear-gradient(90deg,var(--arena),var(--caribe),var(--petroleo))}
.portada-interior{min-height:600px;display:flex;align-items:center;padding-block:75px}
.portada-contenido{max-width:690px}
.etiqueta{display:inline-flex;align-items:center;gap:11px;color:#BCEFFA;font-size:.79rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.etiqueta::before{content:"";width:30px;height:3px;background:var(--arena)}
h1{margin:22px 0;font-size:clamp(2.8rem,5.5vw,5rem);line-height:1.04;letter-spacing:-.045em}
h1 span{display:block;color:var(--arena)}
.portada-texto{max-width:610px;margin-bottom:28px;color:#E5F3F7;font-size:1.1rem}
.acciones{display:flex;flex-wrap:wrap;gap:12px}
.ubicacion{display:flex;align-items:center;gap:9px;margin-top:22px;color:#D2E9EF;font-size:.88rem}
.ubicacion span{color:var(--arena)}

/* ENFOQUES */
.enfoques{background:white;border-bottom:1px solid var(--borde)}
.enfoques-grid{display:grid;grid-template-columns:repeat(3,1fr);padding-block:27px}
.enfoque{display:flex;align-items:center;gap:15px;padding:8px 24px}
.enfoque+.enfoque{border-left:1px solid var(--borde)}
.enfoque-icono{display:grid;place-items:center;flex-shrink:0;width:55px;height:55px;border-radius:16px;background:#E1F6FC;color:var(--petroleo);font-size:1.5rem}
.enfoque strong{display:block;color:var(--petroleo);line-height:1.35}
.enfoque small{display:block;margin-top:4px;color:var(--gris);line-height:1.4}

/* SECCIONES GENERALES */
.seccion{padding-block:85px}
.seccion-fondo{background:var(--fondo)}
.subtitulo{color:#007B9F;font-size:.78rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
h2{margin:12px 0 16px;color:var(--petroleo);font-size:clamp(2rem,3.8vw,3.25rem);line-height:1.12;letter-spacing:-.035em}

/* PROGRAMAS */
.programas-presentacion{display:grid;grid-template-columns:.85fr 1.5fr;align-items:center;gap:45px}
.programas-intro p{margin-bottom:24px;color:var(--gris)}
.programas-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.programa{overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--borde);border-radius:var(--radio);background:white;box-shadow:0 5px 20px rgba(0,54,72,.04);transition:transform .25s ease,box-shadow .25s ease}
.programa:hover{transform:translateY(-5px);box-shadow:var(--sombra)}
.programa-imagen{overflow:hidden;height:190px;background:#DDEFF4}
.programa-imagen img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.programa:hover .programa-imagen img{transform:scale(1.04)}
.programa-contenido{display:flex;flex:1;flex-direction:column;align-items:flex-start;padding:23px}
.programa-icono{display:grid;place-items:center;width:47px;height:47px;margin-top:-45px;margin-bottom:15px;position:relative;border:4px solid white;border-radius:15px;background:#DDF5FC;color:var(--petroleo);font-size:1.25rem}
.programa h3{margin-bottom:10px;color:var(--petroleo);font-size:1.22rem;line-height:1.3}
.programa p{margin-bottom:21px;color:var(--gris);font-size:.94rem}
.enlace-texto{margin-top:auto;color:#007FA4;font-weight:800}
.enlace-texto:hover{color:var(--petroleo);text-decoration:underline}

/* CONÓCENOS */
.conocenos-grid{display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:65px}
.frase-institucional{padding:38px;border-radius:26px;background:radial-gradient(circle at 100% 0%,rgba(0,166,214,.32),transparent 48%),var(--petroleo);color:white;box-shadow:var(--sombra)}
.frase-icono{color:var(--arena);font-size:2.2rem}
.frase-institucional h3{margin:22px 0 17px;font-size:clamp(1.5rem,2.5vw,2.1rem);line-height:1.35}
.frase-institucional p{color:#D8EBF0}
.conocenos-texto>p{margin-bottom:17px;color:var(--gris)}
.conocenos-texto .boton{margin-top:9px}

/* TELEINSULAR */
.teleinsular-home{position:relative;overflow:hidden;padding:70px 0;background:#004B63;color:white}
.teleinsular-contenido{width:min(1100px,calc(100% - 40px));margin-inline:auto;display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr);align-items:center;gap:55px}
.teleinsular-logo{display:grid;place-items:center;min-height:240px;padding:28px;border:1px solid rgba(255,255,255,.18);border-radius:22px;background:rgba(255,255,255,.06)}
.teleinsular-logo img{width:100%;max-width:360px;max-height:230px;object-fit:contain}
.teleinsular-categoria{display:inline-block;margin-bottom:12px;color:#BCEFFA;font-size:.78rem;font-weight:800;letter-spacing:.13em}
.teleinsular-texto h2{margin:8px 0 18px;color:white;font-size:clamp(2rem,4vw,3.2rem)}
.teleinsular-slogan{margin-bottom:10px;color:var(--arena);font-size:1.25rem;font-weight:700}
.teleinsular-respaldo{margin-bottom:25px;color:#D8EBF0}
.teleinsular-boton{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:50px;background:var(--arena);color:#173640;font-weight:800;transition:transform .2s ease,background .2s ease}
.teleinsular-boton:hover{transform:translateY(-2px);background:#FFD16C}

/* REVISTA INSU */
.insu-home{position:relative;overflow:hidden;padding:85px 0;background:radial-gradient(ellipse at 5% 100%,rgba(0,166,214,.17),transparent 38%),linear-gradient(135deg,#062D3B 0%,#004B63 55%,#073746 100%);color:white}
.insu-contenido{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:center;gap:65px}
.insu-portada{position:relative;isolation:isolate;overflow:hidden;display:flex;min-height:420px;flex-direction:column;justify-content:space-between;padding:38px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:linear-gradient(155deg,rgba(0,166,214,.24),transparent 50%),linear-gradient(145deg,#063D50,#021D28);box-shadow:0 28px 60px rgba(0,0,0,.22)}
.insu-portada::before{content:"";position:absolute;z-index:-1;width:240px;height:240px;top:50px;right:-85px;border:1px solid rgba(255,194,71,.55);border-radius:50%;box-shadow:0 0 0 24px rgba(255,194,71,.04),0 0 0 48px rgba(255,194,71,.035)}
.insu-portada::after{content:"CULTURA · MEMORIA · TERRITORIO";position:absolute;right:20px;bottom:95px;color:rgba(255,255,255,.12);font-size:.65rem;font-weight:800;letter-spacing:.15em;writing-mode:vertical-rl}
.insu-marca{color:var(--arena);font-family:Georgia,"Times New Roman",serif;font-size:clamp(5rem,10vw,8.5rem);font-weight:900;letter-spacing:-.09em;line-height:.95}
.insu-tipo{display:inline-block;margin-top:15px;color:#D8EDF3;font-size:.77rem;font-weight:700;letter-spacing:.19em;text-transform:uppercase}
.insu-frase{max-width:330px;margin-top:55px;padding-top:20px;border-top:2px solid var(--arena);color:white;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.5rem,2.6vw,2.15rem);line-height:1.25}
.insu-texto{max-width:570px}
.insu-etiqueta{display:inline-block;margin-bottom:12px;color:#A8E9F7;font-size:.77rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.insu-texto h2{margin:8px 0 20px;color:white;font-size:clamp(2.1rem,4vw,3.2rem);line-height:1.12;letter-spacing:-.04em}
.insu-texto>p{color:#D6E8ED;line-height:1.8}
.insu-detalles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:28px 0}
.insu-detalle{padding:18px;border-left:3px solid var(--arena);background:rgba(255,255,255,.07)}
.insu-detalle strong{display:block;margin-bottom:5px;color:var(--arena);font-size:1rem}
.insu-detalle span{display:block;color:#D6E8ED;font-size:.88rem;line-height:1.55}
.insu-home .boton-borde-oscuro{border-color:var(--arena);background:var(--arena);color:#173640}
.insu-home .boton-borde-oscuro:hover{border-color:#FFD16C;background:#FFD16C}
.insu-respaldo{margin-top:18px;color:#A8C9D2;font-size:.83rem}
